<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linear Search Visualizer</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f4f4f4;
    padding:30px;
}

.container{
    background:white;
    max-width:600px;
    margin:auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:80%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>Linear Search</h1>

    <input type="text" id="array"
    placeholder="Enter numbers separated by commas">

    <br>

    <input type="number" id="target"
    placeholder="Enter target value">

    <br>

    <button onclick="search()">Search</button>

    <div id="result"></div>
</div>

<script>
function linearSearch(arr,target){
    for(let i=0;i<arr.length;i++){
        if(arr[i]===target){
            return i;
        }
    }
    return -1;
}

function search(){

    let arr=document.getElementById("array")
    .value
    .split(",")
    .map(Number);

    let target=Number(
        document.getElementById("target").value
    );

    let index=linearSearch(arr,target);

    if(index!==-1){
        document.getElementById("result").innerHTML=
        `Element found at index ${index}`;
    }
    else{
        document.getElementById("result").innerHTML=
        "Element not found";
    }
}
</script>

</body>
</html>
